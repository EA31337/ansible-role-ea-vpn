---
- name: Configure Docker container
  # Note: Since facts are not gathered, we're checking for ansible_user_id, connection_user or UID instead.
  become: >-
    {{ (connection_user is defined and connection_user != 'root')
    or (ansible_user_id is defined and ansible_user_id != 'root')
    or (lookup('env', 'UID') | int != 0)
    }}
  # Use su as become_method as sudo is not available in all containers.
  become_method: ansible.builtin.su
  gather_facts: false
  hosts: docker_containers

  pre_tasks:
    - name: Ensure container is started
      community.docker.docker_container:
        name: "{{ inventory_hostname }}"
        image: "{{ container_image }}"
        state: started
        command: sleep infinity
      delegate_to: localhost
      vars:
        # Use system Python with requests installed for controller-side Docker modules.
        ansible_python_interpreter: "{{ controller_python }}"

    - name: Wait for container to be ready
      community.docker.docker_container_info:
        name: "{{ inventory_hostname }}"
      register: container_info
      until:
        - container_info is defined
        - container_info.container.State.Running | default(false) | bool
      changed_when: false
      delay: 2
      delegate_to: localhost
      retries: 10
      vars:
        # Use system Python with requests installed for controller-side Docker modules.
        ansible_python_interpreter: "{{ controller_python }}"

    - name: Install Python 3 on Alpine
      ansible.builtin.raw: |
        command -v python3 >/dev/null 2>&1 || \
          (apk update -q && apk add -q --no-cache python3 py3-pip sudo bash ca-certificates procps)
      changed_when: false
      when: container_image is search("alpine")

    - name: Install Python 3 on Ubuntu/Debian
      ansible.builtin.raw: |
        command -v python3 >/dev/null 2>&1 || \
          (export DEBIAN_FRONTEND=noninteractive && \
          apt-get update -qq && \
          apt-get install -y -qq --no-install-recommends python3 python3-pip sudo ca-certificates procps)
      changed_when: false
      when: container_image is search("ubuntu") or container_image is search("debian")

    - name: Install or verify Python on NixOS
      ansible.builtin.raw: |
        PATH=/root/.nix-profile/bin:/nix/var/nix/profiles/default/bin:/run/current-system/sw/bin:$PATH
        if ! command -v python3 >/dev/null 2>&1; then
          nix-channel --update > /dev/null
          nix-env -iA nixpkgs.python3 nixpkgs.python3Packages.pip nixpkgs.sudo nixpkgs.procps > /dev/null
        fi
      changed_when: false
      when: container_image is search("nixos")

    - name: Gather facts
      ansible.builtin.setup:

    - name: Install Python packages for Ubuntu/Debian
      ansible.builtin.apt:
        name:
          - python3
          - python3-pip
          - python3-setuptools
          - sudo
        state: present
        update_cache: true
      when: container_image is search("ubuntu") or container_image is search("debian")

  tags: always
  vars:
    controller_python: "{{ ansible_playbook_python }}"
    container_image_map:
      ea-vpn-on-alpine-latest: alpine:latest
      ea-vpn-on-debian-latest: debian:latest
      ea-vpn-on-nixos-latest: nixos/nix
      ea-vpn-on-ubuntu-jammy: ubuntu:jammy
      ea-vpn-on-ubuntu-latest: ubuntu:latest
      ea-vpn-on-ubuntu-noble: ubuntu:noble
    container_image: "{{ container_image_map[inventory_hostname] | default('ubuntu:latest') }}"

- name: Install ea31337.ea_vpn role on all containers
  hosts: docker_containers
  gather_facts: true
  tags: always
  vars:
    controller_python: "{{ ansible_playbook_python }}"
  tasks:
    - name: Installs ea31337.ea_vpn role
      ansible.builtin.import_role:
        name: ea31337.ea_vpn

  post_tasks:
    - name: Stop Docker containers
      community.docker.docker_container:
        name: "{{ inventory_hostname }}"
        state: stopped
      delegate_to: localhost
      failed_when: false
